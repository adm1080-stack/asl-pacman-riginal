<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASL Pac-Man - Deaf Culture Edition</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --maze-wall: #38bdf8;
      --pacman-color: #facc15;
      --text-color: #ffffff;
      --quit-color: #ef4444;
      --card-bg: rgba(20, 25, 45, 0.85);
      --card-border: rgba(255, 255, 255, 0.2);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      min-height: 100vh;
      width: 100vw;
      box-sizing: border-box;
    }

    /* Fullscreen Welcome Overlay */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #welcome-screen h1 {
      font-size: 2.8rem;
      color: var(--pacman-color);
      margin: 0 0 10px 0;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
      letter-spacing: 2px;
    }

    #welcome-screen p {
      font-size: 1.2rem;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .welcome-card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--card-border);
      padding: 30px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      max-width: 400px;
      width: 90%;
    }

    header {
      text-align: center;
      max-width: 500px;
      margin: 15px 0 10px 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }

    h1 { color: var(--pacman-color); margin: 0 0 5px 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    p { color: #e2e8f0; font-size: 0.9rem; margin: 0; }

    #game-container {
      position: relative;
      width: 330px;
      height: 330px;
      background-color: #000000;
      border: 3px solid var(--maze-wall);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }

    canvas { display: block; background-color: #000000; }

    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      border-radius: 5px;
    }

    .username-box {
      margin: 5px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .username-box label {
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .username-box input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background-color: #0f172a;
      color: var(--pacman-color);
      font-weight: bold;
      text-align: center;
      width: 80%;
      font-size: 1rem;
      outline: none;
    }

    .username-box input:focus {
      border-color: var(--pacman-color);
    }

    .enter-hint {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 8px;
    }

    .outer-dashboard {
      width: 330px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stats-card, .leaderboard-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.85rem;
      backdrop-filter: blur(8px);
    }

    .stats-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 6px;
    }

    .stats-card strong {
      color: var(--pacman-color);
    }

    .leaderboard-card header {
      text-align: left;
      font-weight: bold;
      color: var(--pacman-color);
      margin-bottom: 6px;
      background: none;
      padding: 0;
      border: none;
    }

    .leaderboard-list {
      max-height: 100px;
      overflow-y: auto;
      margin: 0;
      padding-left: 0;
      list-style-type: none;
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    .leaderboard-list li {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .leaderboard-list li:last-child {
      border-bottom: none;
    }

    button.btn {
      background-color: var(--quit-color);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s ease;
    }

    button.btn:active {
      transform: scale(0.96);
    }

    button.pause-btn {
      background-color: var(--quit-color);
      color: #fff;
    }

    .fact-banner {
      width: 330px;
      min-height: 44px;
      margin-top: 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 10px;
      box-sizing: border-box;
      text-align: center;
      font-size: 0.85rem;
      color: var(--pacman-color);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }

    .controls {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-gap: 5px;
      justify-content: center;
    }

    .ctrl-btn {
      width: 50px;
      height: 50px;
      background-color: rgba(30, 41, 59, 0.85);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
